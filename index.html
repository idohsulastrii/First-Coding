<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Portfolio</title>
    <style>
        /* Reset & Base Setup */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Inter', -apple-system, sans-serif;
            display: grid;
            place-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Glassmorphism Card */
        .content {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            padding: 4rem;
            text-align: center;
            transition: transform 0.4s ease;
            position: relative;
            z-index: 10;
        }

        /* Modern Gradient Typography */
        .headline {
            font-size: clamp(2.5rem, 6vw, 5rem);
            letter-spacing: -0.04em;
            text-transform: uppercase;
            font-weight: 800;
            margin-bottom: 1.5rem;
            
            /* Teknik Clip agar gradien masuk ke dalam teks */
            background: linear-gradient(180deg, #ffffff 0%, #a0a0a0 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent; /* PENTING: ini agar teks tidak tertutup */
        }

        .subline {
            font-size: 0.9rem;
            color: #888888;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            border-top: 1px solid #444;
            padding-top: 1rem;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="content">
        <h1 class="headline">WELCOME!<br>IT'S MY FIRST<br>CODING PROJECT</h1>
        <p class="subline">crafted with precision and elegance</p>
    </div>

    <script>
        // Interaksi Parallax Halus
        const card = document.querySelector('.content');

        document.addEventListener('mousemove', (e) => {
            const xPos = (e.clientX / window.innerWidth - 0.5) * 20;
            const yPos = (e.clientY / window.innerHeight - 0.5) * 20;
            card.style.transform = `perspective(1000px) rotateY(${xPos}deg) rotateX(${-yPos}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            card.style.transform = 'perspective(1000px) rotateY(0deg) rotateX(0deg)';
        });
    </script>
</body>
</html>
