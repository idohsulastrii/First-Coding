<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Project</title>
    <style>
        body {
            margin: 0;
            background-color: #000; /* Hitam pekat modern */
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        .text-container {
            text-align: center;
            /* Animasi muncul pelan-pelan */
            animation: fadeIn 2s ease-in;
        }

        h1 {
            font-size: 3rem;
            font-weight: 300; /* Tipis modern */
            letter-spacing: -1px;
            margin: 0;
        }

        /* Definisi animasi */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="text-container">
        <h1>WELCOME! IT'S MY FIRST CODING PROJECT</h1>
    </div>

</body>
</html>
