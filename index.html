<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Professional Project</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: sans-serif;
        }

        /* Ini adalah wadah teksnya */
        .container {
            position: relative;
            z-index: 100; /* Pastikan dia paling depan */
            text-align: center;
        }

        /* Judul yang elegan */
        h1 {
            font-size: 4rem;
            text-transform: uppercase;
            letter-spacing: -2px;
            
            /* Background gradien untuk teks */
            background: linear-gradient(to bottom, #ffffff, #666666);
            
            /* KUNCI: Supaya teks kelihatan dan tidak tertutup */
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent; 
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>WELCOME! IT'S MY FIRST CODING PROJECT</h1>
    </div>

</body>
</html>
